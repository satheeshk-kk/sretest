name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]  
    paths:
      - 'math.js'           # Matches a specific file name  

  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:          
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test          
